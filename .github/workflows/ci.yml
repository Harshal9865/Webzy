name: Webzy CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Secret Scan, Migrations, Lint, Typecheck, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Secret scan (fail on accidentally committed keys)
        run: |
          set -euo pipefail
          PATTERN='(rzp_live_[A-Za-z0-9]{8,}|sb_secret_[A-Za-z0-9_-]{12,}|re_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|sk_live_[A-Za-z0-9]{16,}|whsec_[A-Za-z0-9]{16,}|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)'
          if git grep -nE "$PATTERN" -- apps packages infra docs .env.example; then
            echo "::error::Potential live secret detected in tracked files."
            exit 1
          fi
          echo "OK: Zero live secrets detected in tracked files."

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Verify additive-only SQL migrations
        run: npm run check:migrations

      - name: Check formatting (advisory)
        run: |
          if ! npm run format:check; then
            echo "::warning::Formatting drift detected. Run 'npm run format' locally to clean up."
          fi

      - name: Run ESLint across workspaces
        run: npm run lint

      - name: Run TypeScript typecheck across workspaces
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/web/.next/cache
            apps/admin/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/**/*.{ts,tsx}', 'packages/**/*.{ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Build production apps (@webzy/web and @webzy/admin)
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: staging
          PAYMENT_PROVIDER: mock
          ALLOW_MOCK_IN_PROD: 'false'

      - name: Production dependency vulnerability audit (advisory)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
