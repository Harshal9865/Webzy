<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Gulab Bagh golden-hour floral marble mandap with rose canopy, urli and lanterns">
  <defs>
    <linearGradient id="bgRose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6EE"/>
      <stop offset="45%" stop-color="#F6D9DC"/>
      <stop offset="100%" stop-color="#AE7282"/>
    </linearGradient>
    <linearGradient id="champ" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F6DFB1"/>
      <stop offset="50%" stop-color="#C69658"/>
      <stop offset="100%" stop-color="#8B5F2F"/>
    </linearGradient>
    <radialGradient id="sunset" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#FFF7E2" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F9DCC6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F6D9DC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDFB"/>
      <stop offset="100%" stop-color="#E9D3D7"/>
    </linearGradient>
    <radialGradient id="lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF3CF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF3CF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgRose)"/>
  <ellipse cx="800" cy="380" rx="640" ry="300" fill="url(#sunset)"/>

  <!-- Distant Cypress & Garden Arches -->
  <g fill="#7E9178" opacity="0.55">
    <ellipse cx="160" cy="560" rx="22" ry="110"/><ellipse cx="220" cy="580" rx="16" ry="86"/>
    <ellipse cx="1440" cy="560" rx="22" ry="110"/><ellipse cx="1380" cy="580" rx="16" ry="86"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="3">
    <path d="M260 680 L260 520 Q310 470 360 520 L360 680"/>
    <path d="M1240 680 L1240 520 Q1290 470 1340 520 L1340 680"/>
  </g>

  <g transform="translate(800 0)">
    <!-- Marble Pillars with Rose Vines -->
    <rect x="-430" y="210" width="44" height="560" fill="url(#marble)" stroke="#D3AEB6" stroke-width="1.5"/>
    <rect x="386" y="210" width="44" height="560" fill="url(#marble)" stroke="#D3AEB6" stroke-width="1.5"/>
    <rect x="-440" y="200" width="64" height="14" fill="url(#champ)"/>
    <rect x="376" y="200" width="64" height="14" fill="url(#champ)"/>
    <g stroke="#7E9178" stroke-width="3" fill="none">
      <path d="M-408 770 Q-440 650 -400 560 Q-370 470 -410 380 Q-440 300 -404 220"/>
      <path d="M408 770 Q440 650 400 560 Q370 470 410 380 Q440 300 404 220"/>
    </g>
    <g fill="#DE8F9E">
      <circle cx="-422" cy="640" r="11"/><circle cx="-392" cy="520" r="12"/><circle cx="-420" cy="400" r="11"/><circle cx="-398" cy="290" r="10"/>
      <circle cx="422" cy="640" r="11"/><circle cx="392" cy="520" r="12"/><circle cx="420" cy="400" r="11"/><circle cx="398" cy="290" r="10"/>
    </g>
    <g fill="#F8D2D8">
      <circle cx="-422" cy="640" r="5"/><circle cx="-392" cy="520" r="5"/><circle cx="422" cy="640" r="5"/><circle cx="392" cy="520" r="5"/>
    </g>

    <!-- Cusped Arch Canopy -->
    <path d="M-450 220 Q-300 120 -150 150 Q-60 90 0 70 Q60 90 150 150 Q300 120 450 220" fill="none" stroke="url(#champ)" stroke-width="10"/>
    <circle cx="0" cy="58" r="10" fill="url(#champ)"/>

    <!-- Layered Blush Silk Drapes -->
    <path d="M-410 225 Q-205 370 0 230 Q205 370 410 225 L410 268 Q205 410 0 272 Q-205 410 -410 268 Z" fill="#F0BDC6" opacity="0.75"/>
    <path d="M-410 268 Q-205 430 0 300 Q205 430 410 268 L410 290 Q205 450 0 320 Q-205 450 -410 290 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Floral Canopy Clusters -->
    <g>
      <circle cx="-360" cy="210" r="28" fill="#DD8F9E"/><circle cx="-326" cy="190" r="20" fill="#F8D2D8"/><circle cx="-386" cy="186" r="16" fill="#FFFFFF"/>
      <circle cx="-230" cy="160" r="24" fill="#E6A1AF"/><circle cx="-200" cy="176" r="16" fill="#FFFFFF"/>
      <circle cx="-110" cy="132" r="22" fill="#DD8F9E"/>
      <circle cx="0" cy="104" r="32" fill="#DC8E9D"/><circle cx="0" cy="104" r="16" fill="#FFF2F4"/>
      <circle cx="-36" cy="118" r="18" fill="#FFFFFF"/><circle cx="36" cy="118" r="18" fill="#FFFFFF"/>
      <circle cx="110" cy="132" r="22" fill="#DD8F9E"/>
      <circle cx="230" cy="160" r="24" fill="#E6A1AF"/><circle cx="200" cy="176" r="16" fill="#FFFFFF"/>
      <circle cx="360" cy="210" r="28" fill="#DD8F9E"/><circle cx="326" cy="190" r="20" fill="#F8D2D8"/><circle cx="386" cy="186" r="16" fill="#FFFFFF"/>
    </g>
    <g fill="#7E9178">
      <ellipse cx="-296" cy="196" rx="16" ry="6" transform="rotate(-20 -296 196)"/>
      <ellipse cx="296" cy="196" rx="16" ry="6" transform="rotate(20 296 196)"/>
      <ellipse cx="-62" cy="96" rx="14" ry="5" transform="rotate(-25 -62 96)"/>
      <ellipse cx="62" cy="96" rx="14" ry="5" transform="rotate(25 62 96)"/>
    </g>

    <!-- Hanging Rose Strings -->
    <g stroke="#C69658" stroke-width="1.2">
      <line x1="-260" y1="300" x2="-260" y2="430"/><line x1="-130" y1="320" x2="-130" y2="470"/>
      <line x1="130" y1="320" x2="130" y2="470"/><line x1="260" y1="300" x2="260" y2="430"/>
    </g>
    <g fill="#E6A1AF">
      <circle cx="-260" cy="350" r="6"/><circle cx="-260" cy="390" r="6"/><circle cx="-260" cy="430" r="8"/>
      <circle cx="-130" cy="370" r="6"/><circle cx="-130" cy="420" r="6"/><circle cx="-130" cy="470" r="8"/>
      <circle cx="130" cy="370" r="6"/><circle cx="130" cy="420" r="6"/><circle cx="130" cy="470" r="8"/>
      <circle cx="260" cy="350" r="6"/><circle cx="260" cy="390" r="6"/><circle cx="260" cy="430" r="8"/>
    </g>

    <!-- Brass Lanterns -->
    <g>
      <circle cx="-330" cy="700" r="34" fill="url(#lantern)"/>
      <circle cx="330" cy="700" r="34" fill="url(#lantern)"/>
      <path d="M-344 720 L-344 690 L-330 676 L-316 690 L-316 720 Z" fill="none" stroke="url(#champ)" stroke-width="3"/>
      <path d="M316 720 L316 690 L330 676 L344 690 L344 720 Z" fill="none" stroke="url(#champ)" stroke-width="3"/>
      <path d="M-330 690 Q-325 700 -330 708 Q-335 700 -330 690 Z" fill="#F6C35A"/>
      <path d="M330 690 Q335 700 330 708 Q325 700 330 690 Z" fill="#F6C35A"/>
    </g>

    <!-- Low Silk Seating Cushions -->
    <rect x="-140" y="700" width="90" height="46" rx="10" fill="#E4B0BA" stroke="#C69658" stroke-width="1.5"/>
    <rect x="50" y="700" width="90" height="46" rx="10" fill="#E4B0BA" stroke="#C69658" stroke-width="1.5"/>

    <!-- Marble Platform & Rangoli -->
    <rect x="-500" y="748" width="1000" height="44" fill="#FFF9F8" stroke="#CFA7B0" stroke-width="1.5"/>
    <rect x="-560" y="792" width="1120" height="108" fill="#E7C6CE"/>
    <g transform="translate(0 846)" fill="none" stroke="#FFFFFF" stroke-opacity="0.8">
      <ellipse rx="300" ry="30" stroke-width="2" stroke-dasharray="6 8"/>
      <ellipse rx="200" ry="18" stroke-width="1.5"/>
    </g>

    <!-- Brass Urli with Floating Roses & Diyas -->
    <ellipse cx="0" cy="728" rx="96" ry="26" fill="url(#champ)"/>
    <ellipse cx="0" cy="722" rx="80" ry="18" fill="#FBE5E9"/>
    <circle cx="-34" cy="722" r="10" fill="#DE8C9C"/>
    <circle cx="0" cy="716" r="13" fill="#E8A0AE"/>
    <circle cx="34" cy="722" r="10" fill="#DE8C9C"/>
    <path d="M-60 718 Q-56 708 -60 700 Q-64 708 -60 718 Z" fill="#F6C35A"/>
    <path d="M60 718 Q64 708 60 700 Q56 708 60 718 Z" fill="#F6C35A"/>
  </g>

  <!-- Drifting Petals -->
  <g fill="#F4B6C2" opacity="0.8">
    <ellipse cx="420" cy="300" rx="6" ry="3" transform="rotate(30 420 300)"/>
    <ellipse cx="1180" cy="340" rx="6" ry="3" transform="rotate(-20 1180 340)"/>
    <ellipse cx="600" cy="460" rx="5" ry="3" transform="rotate(50 600 460)"/>
    <ellipse cx="1020" cy="500" rx="5" ry="3" transform="rotate(-40 1020 500)"/>
  </g>
</svg>
