<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Grace Cathedral coastal heritage chapel and garden courtyard wide scene">
  <defs>
    <linearGradient id="skyGW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFEFC"/>
      <stop offset="36%" stop-color="#FAF6EE"/>
      <stop offset="58%" stop-color="#EAE4D8"/>
      <stop offset="80%" stop-color="#BCC5B8"/>
      <stop offset="100%" stop-color="#485B4C"/>
    </linearGradient>
    <radialGradient id="haloGW" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F8E9C8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#EAE4D8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stoneGW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F3EDE2"/>
      <stop offset="100%" stop-color="#D4C8B6"/>
    </linearGradient>
    <linearGradient id="goldGW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E4BA"/>
      <stop offset="52%" stop-color="#C49A55"/>
      <stop offset="100%" stop-color="#876029"/>
    </linearGradient>
    <radialGradient id="roseWinGW" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="50%" stop-color="#E1C68D"/>
      <stop offset="100%" stop-color="#5E7164"/>
    </radialGradient>
  </defs>

  <!-- Airy Ivory Sky (Top 42% clean for couple typography) -->
  <rect width="1600" height="900" fill="url(#skyGW)"/>
  <ellipse cx="800" cy="430" rx="680" ry="290" fill="url(#haloGW)"/>

  <!-- Soft Coastal Hills & Mediterranean/Goan Cypress Groves -->
  <path d="M0 565 Q320 505 640 544 T1280 534 T1600 552 L1600 670 L0 670 Z" fill="#A6B3A2" opacity="0.44"/>
  <path d="M0 595 Q400 545 800 575 T1600 565 L1600 675 L0 675 Z" fill="#7D917B" opacity="0.42"/>
  <g fill="#536852" opacity="0.8">
    <ellipse cx="136" cy="542" rx="22" ry="106"/>
    <ellipse cx="188" cy="560" rx="18" ry="88"/>
    <ellipse cx="234" cy="575" rx="15" ry="72"/>
    <ellipse cx="276" cy="586" rx="13" ry="58"/>
    <ellipse cx="1464" cy="542" rx="22" ry="106"/>
    <ellipse cx="1412" cy="560" rx="18" ry="88"/>
    <ellipse cx="1366" cy="575" rx="15" ry="72"/>
    <ellipse cx="1324" cy="586" rx="13" ry="58"/>
  </g>

  <!-- Panoramic White Heritage Basilica, Twin Belfries & Arched Cloister Colonnades -->
  <g transform="translate(800 0)">
    <!-- Outer Cloister Wings & Balustrade -->
    <rect x="-520" y="542" width="286" height="126" fill="url(#stoneGW)" stroke="#C8BCAA" stroke-width="1.4"/>
    <rect x="234" y="542" width="286" height="126" fill="url(#stoneGW)" stroke="#C8BCAA" stroke-width="1.4"/>
    <rect x="-526" y="534" width="296" height="8" fill="#E8DEC9" stroke="url(#goldGW)" stroke-width="1"/>
    <rect x="230" y="534" width="296" height="8" fill="#E8DEC9" stroke="url(#goldGW)" stroke-width="1"/>

    <!-- Cloister Arches with Warm Interior Lanterns -->
    <g fill="#617164" stroke="url(#goldGW)" stroke-width="1.2">
      <path d="M-492 668 L-492 586 Q-466 562 -440 586 L-440 668 Z"/>
      <path d="M-412 668 L-412 586 Q-386 562 -360 586 L-360 668 Z"/>
      <path d="M-332 668 L-332 586 Q-306 562 -280 586 L-280 668 Z"/>
      <path d="M280 668 L280 586 Q306 562 332 586 L332 668 Z"/>
      <path d="M360 668 L360 586 Q386 562 412 586 L412 668 Z"/>
      <path d="M440 668 L440 586 Q466 562 492 586 L492 668 Z"/>
    </g>
    <g fill="#FFF2C6" opacity="0.55">
      <circle cx="-466" cy="614" r="10"/><circle cx="-386" cy="614" r="10"/><circle cx="-306" cy="614" r="10"/>
      <circle cx="306" cy="614" r="10"/><circle cx="386" cy="614" r="10"/><circle cx="466" cy="614" r="10"/>
    </g>

