    <g transform="translate(625 765)">
      <rect x="-12" y="12" width="24" height="30" rx="3" fill="#F4EEE3" stroke="#C49A55" stroke-width="1.2"/>
      <ellipse cx="0" cy="4" rx="24" ry="10" fill="#6E8469"/>
      <circle cx="-10" cy="-2" r="12" fill="#FFFFFF"/><circle cx="10" cy="-2" r="12" fill="#FAF3E6"/>
      <circle cx="0" cy="-10" r="14" fill="#FFFFFF"/><circle cx="0" cy="-10" r="3.5" fill="#D9B166"/>
    </g>
    <g transform="translate(975 765)">
      <rect x="-12" y="12" width="24" height="30" rx="3" fill="#F4EEE3" stroke="#C49A55" stroke-width="1.2"/>
      <ellipse cx="0" cy="4" rx="24" ry="10" fill="#6E8469"/>
      <circle cx="-10" cy="-2" r="12" fill="#FFFFFF"/><circle cx="10" cy="-2" r="12" fill="#FAF3E6"/>
      <circle cx="0" cy="-10" r="14" fill="#FFFFFF"/><circle cx="0" cy="-10" r="3.5" fill="#D9B166"/>
    </g>
    <g transform="translate(565 845)">
      <rect x="-15" y="15" width="30" height="38" rx="3" fill="#F4EEE3" stroke="#C49A55" stroke-width="1.3"/>
      <ellipse cx="0" cy="4" rx="30" ry="12" fill="#6E8469"/>
      <circle cx="-13" cy="-2" r="15" fill="#FFFFFF"/><circle cx="13" cy="-2" r="15" fill="#FAF3E6"/>
      <circle cx="0" cy="-12" r="16" fill="#FFFFFF"/><circle cx="0" cy="-12" r="4" fill="#D9B166"/>
    </g>
    <g transform="translate(1035 845)">
      <rect x="-15" y="15" width="30" height="38" rx="3" fill="#F4EEE3" stroke="#C49A55" stroke-width="1.3"/>
      <ellipse cx="0" cy="4" rx="30" ry="12" fill="#6E8469"/>
      <circle cx="-13" cy="-2" r="15" fill="#FFFFFF"/><circle cx="13" cy="-2" r="15" fill="#FAF3E6"/>
      <circle cx="0" cy="-12" r="16" fill="#FFFFFF"/><circle cx="0" cy="-12" r="4" fill="#D9B166"/>
    </g>
  </g>

  <!-- Champagne-Gold Outer Border & Corner Olive/Lily Boughs -->
  <rect x="24" y="24" width="1552" height="852" fill="none" stroke="url(#goldGW)" stroke-width="2.2" opacity="0.76"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#C49A55" stroke-width="0.9" opacity="0.48"/>
  <g opacity="0.88">
    <path d="M26 108 Q68 54 152 28" fill="none" stroke="#6E8469" stroke-width="3"/>
    <ellipse cx="72" cy="64" rx="22" ry="8" transform="rotate(-26 72 64)" fill="#7E9478"/>
    <ellipse cx="116" cy="44" rx="20" ry="7" transform="rotate(-12 116 44)" fill="#8FA489"/>
    <circle cx="50" cy="84" r="14" fill="#FFFFFF" stroke="#C49A55" stroke-width="1"/>
    <circle cx="50" cy="84" r="4" fill="#D9B166"/>

    <path d="M1574 108 Q1532 54 1448 28" fill="none" stroke="#6E8469" stroke-width="3"/>
    <ellipse cx="1528" cy="64" rx="22" ry="8" transform="rotate(26 1528 64)" fill="#7E9478"/>
    <ellipse cx="1484" cy="44" rx="20" ry="7" transform="rotate(12 1484 44)" fill="#8FA489"/>
    <circle cx="1550" cy="84" r="14" fill="#FFFFFF" stroke="#C49A55" stroke-width="1"/>
    <circle cx="1550" cy="84" r="4" fill="#D9B166"/>
  </g>
