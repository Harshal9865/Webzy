    <line x1="-200" y1="382" x2="-200" y2="416" stroke="url(#goldGW)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-211" y1="395" x2="-189" y2="395" stroke="url(#goldGW)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-238 458 L-200 412 L-162 458 Z" fill="#E6DBC8" stroke="url(#goldGW)" stroke-width="1.4"/>
    <rect x="-234" y="458" width="68" height="210" fill="url(#stoneGW)" stroke="#C8BCAA" stroke-width="1.5"/>
    <path d="M-214 516 L-214 480 Q-200 466 -186 480 L-186 516 Z" fill="#5D6E61" stroke="url(#goldGW)" stroke-width="1.2"/>
    <circle cx="-200" cy="494" r="5" fill="url(#goldGW)"/>
    <path d="M-212 604 L-212 554 Q-200 540 -188 554 L-188 604 Z" fill="url(#roseWinGW)" stroke="url(#goldGW)" stroke-width="1.2"/>

    <line x1="200" y1="382" x2="200" y2="416" stroke="url(#goldGW)" stroke-width="3" stroke-linecap="round"/>
    <line x1="189" y1="395" x2="211" y2="395" stroke="url(#goldGW)" stroke-width="3" stroke-linecap="round"/>
    <path d="M162 458 L200 412 L238 458 Z" fill="#E6DBC8" stroke="url(#goldGW)" stroke-width="1.4"/>
    <rect x="166" y="458" width="68" height="210" fill="url(#stoneGW)" stroke="#C8BCAA" stroke-width="1.5"/>
    <path d="M186 516 L186 480 Q200 466 214 480 L214 516 Z" fill="#5D6E61" stroke="url(#goldGW)" stroke-width="1.2"/>
    <circle cx="200" cy="494" r="5" fill="url(#goldGW)"/>
    <path d="M188 604 L188 554 Q200 540 212 554 L212 604 Z" fill="url(#roseWinGW)" stroke="url(#goldGW)" stroke-width="1.2"/>

    <!-- Central Baroque Chapel Gable & Cross -->
    <line x1="0" y1="358" x2="0" y2="412" stroke="url(#goldGW)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="-18" y1="378" x2="18" y2="378" stroke="url(#goldGW)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M-166 516 L-166 468 Q-96 460 -64 418 Q0 392 64 418 Q96 460 166 468 L166 516 Z" fill="url(#stoneGW)" stroke="#C8BCAA" stroke-width="1.6"/>
    <circle cx="0" cy="458" r="16" fill="#FAF3E4" stroke="url(#goldGW)" stroke-width="1.6"/>

    <!-- Main Nave & Stained-Glass Rose Window -->
    <rect x="-166" y="516" width="332" height="152" fill="url(#stoneGW)" stroke="#C8BCAA" stroke-width="1.6"/>
    <rect x="-152" y="516" width="12" height="152" fill="#FAF6EE"/>
    <rect x="140" y="516" width="12" height="152" fill="#FAF6EE"/>
    <circle cx="0" cy="556" r="30" fill="url(#roseWinGW)" stroke="url(#goldGW)" stroke-width="2.6"/>
    <circle cx="0" cy="556" r="18" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="0" y1="526" x2="0" y2="586" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="-30" y1="556" x2="30" y2="556" stroke="#FFFFFF" stroke-width="1"/>

    <!-- Side Lancet Windows on Nave -->
    <path d="M-116 632 L-116 572 Q-102 556 -88 572 L-88 632 Z" fill="url(#roseWinGW)" stroke="url(#goldGW)" stroke-width="1.4"/>
    <path d="M88 632 L88 572 Q102 556 116 572 L116 632 Z" fill="url(#roseWinGW)" stroke="url(#goldGW)" stroke-width="1.4"/>

    <!-- Grand Portal & White Rose Arch Garland -->
    <path d="M-52 668 L-52 604 Q0 572 52 604 L52 668 Z" fill="#5D4738" stroke="url(#goldGW)" stroke-width="2.2"/>
    <line x1="0" y1="588" x2="0" y2="668" stroke="url(#goldGW)" stroke-width="1.5"/>
    <ellipse cx="0" cy="638" rx="28" ry="30" fill="#FFF2C6" opacity="0.52"/>
    <path d="M-56 612 Q0 568 56 612" fill="none" stroke="#687E63" stroke-width="8" stroke-linecap="round"/>
    <path d="M-56 612 Q0 568 56 612" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>

    <!-- Stepped Limestone Plinth -->
    <rect x="-548" y="668" width="1096" height="12" fill="#F5EFE5" stroke="#C8BCAA" stroke-width="1"/>
    <rect x="-576" y="680" width="1152" height="12" fill="#E6DDD0" stroke="#C8BCAA" stroke-width="1"/>
  </g>

  <!-- Courtyard Lawn, Parterre Walkways & Stone Processional Aisle -->
  <rect x="0" y="692" width="1600" height="208" fill="#495C4C"/>
  <polygon points="705,692 895,692 1060,900 540,900" fill="#EAE3D6"/>
  <line x1="705" y1="692" x2="540" y2="900" stroke="url(#goldGW)" stroke-width="2.4"/>
  <line x1="895" y1="692" x2="1060" y2="900" stroke="url(#goldGW)" stroke-width="2.4"/>

