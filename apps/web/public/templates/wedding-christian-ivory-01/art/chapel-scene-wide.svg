    <ellipse cx="370" cy="795" rx="95" ry="28" fill="#8BA193" stroke="#E8DEC9" stroke-width="4"/>
    <path d="M370 792 Q360 755 348 776 M370 792 Q380 755 392 776 M370 792 L370 748" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.75"/>
    <ellipse cx="1230" cy="795" rx="95" ry="28" fill="#8BA193" stroke="#E8DEC9" stroke-width="4"/>
    <path d="M1230 792 Q1220 755 1208 776 M1230 792 Q1240 755 1252 776 M1230 792 L1230 748" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.75"/>

