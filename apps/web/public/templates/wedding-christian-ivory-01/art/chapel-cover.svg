    <circle r="158" fill="none" stroke="#C69D58" stroke-width="0.9" stroke-dasharray="2 6" opacity="0.65"/>
    <!-- Left & Right Olive Boughs -->
    <path d="M-28 126 C-136 98 -154 -14 -128 -96 C-108 -142 -58 -152 -24 -144" fill="none" stroke="#687D63" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M28 126 C136 98 154 -14 128 -96 C108 -142 58 -152 24 -144" fill="none" stroke="#687D63" stroke-width="3.2" stroke-linecap="round"/>
    <g fill="#7F9479" opacity="0.9">
      <ellipse cx="-116" cy="68" rx="20" ry="7.5" transform="rotate(-36 -116 68)"/>
      <ellipse cx="-142" cy="24" rx="21" ry="7.5" transform="rotate(-18 -142 24)"/>
      <ellipse cx="-146" cy="-24" rx="21" ry="7.5" transform="rotate(6 -146 -24)"/>
      <ellipse cx="-132" cy="-72" rx="20" ry="7.5" transform="rotate(28 -132 -72)"/>
      <ellipse cx="-98" cy="-116" rx="18" ry="6.8" transform="rotate(46 -98 -116)"/>
      <ellipse cx="-54" cy="-140" rx="16" ry="6" transform="rotate(64 -54 -140)"/>

      <ellipse cx="116" cy="68" rx="20" ry="7.5" transform="rotate(36 116 68)"/>
      <ellipse cx="142" cy="24" rx="21" ry="7.5" transform="rotate(18 142 24)"/>
      <ellipse cx="146" cy="-24" rx="21" ry="7.5" transform="rotate(-6 146 -24)"/>
      <ellipse cx="132" cy="-72" rx="20" ry="7.5" transform="rotate(-28 132 -72)"/>
      <ellipse cx="98" cy="-116" rx="18" ry="6.8" transform="rotate(-46 98 -116)"/>
      <ellipse cx="54" cy="-140" rx="16" ry="6" transform="rotate(-64 54 -140)"/>
    </g>
    <!-- Blooming White Lilies & Pearl Berries Embedded in Wreath -->
    <g fill="#FFFFFF" stroke="#C69D58" stroke-width="1.1">
      <path d="M-126 6 C-144 -10 -158 2 -142 18 C-156 26 -142 42 -124 28 C-110 40 -98 22 -114 12 C-102 -2 -116 -10 -126 6 Z"/>
      <path d="M126 6 C144 -10 158 2 142 18 C156 26 142 42 124 28 C110 40 98 22 114 12 C102 -2 116 -10 126 6 Z"/>
      <circle cx="-126" cy="15" r="4" fill="#E3BC6B"/>
      <circle cx="126" cy="15" r="4" fill="#E3BC6B"/>
      <circle cx="-86" cy="96" r="5"/><circle cx="-136" cy="-48" r="4.5"/><circle cx="-74" cy="-130" r="4.5"/>
      <circle cx="86" cy="96" r="5"/><circle cx="136" cy="-48" r="4.5"/><circle cx="74" cy="-130" r="4.5"/>
    </g>

    <!-- Scalloped Champagne-Gold Sanctuary Seal Base -->
    <circle r="98" fill="#FAF4E8" stroke="url(#champGold)" stroke-width="3"/>
    <circle r="86" fill="#FFFEFB" stroke="#C69D58" stroke-width="1.2"/>
    <circle r="74" fill="none" stroke="#C69D58" stroke-width="1" stroke-dasharray="3 4"/>
    <!-- Flared Cathedral Cross with Gold Rays -->
    <g stroke="#E5C888" stroke-width="1" opacity="0.7">
      <line x1="-34" y1="-44" x2="34" y2="24"/>
      <line x1="34" y1="-44" x2="-34" y2="24"/>
    </g>
    <path d="M0 -48 L0 48 M-32 -12 L32 -12" stroke="url(#champGold)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-48" r="3.5" fill="url(#champGold)"/>
    <circle cx="0" cy="48" r="3.5" fill="url(#champGold)"/>
    <circle cx="-32" cy="-12" r="3.5" fill="url(#champGold)"/>
    <circle cx="32" cy="-12" r="3.5" fill="url(#champGold)"/>
    <circle cx="0" cy="-12" r="10" fill="#FFFEFA" stroke="url(#champGold)" stroke-width="2.2"/>
    <circle cx="0" cy="-12" r="3.5" fill="url(#champGold)"/>
  </g>

  <!-- Lush White Madonna Lily & Olive Corner Bouquets at Sanctuary Base -->
  <g transform="translate(215 1018)">
    <ellipse cx="-24" cy="14" rx="24" ry="8" transform="rotate(-22 -24 14)" fill="#758B70"/>
    <ellipse cx="28" cy="12" rx="24" ry="8" transform="rotate(20 28 12)" fill="#899E83"/>
    <path d="M0 -30 C16 -12 24 8 0 22 C-24 8 -16 -12 0 -30 Z" fill="#FFFFFF" stroke="#C69D58" stroke-width="1.2"/>
    <path d="M-28 -8 C-8 -14 2 2 -2 22 C-20 16 -32 4 -28 -8 Z" fill="#FAF5EC" stroke="#C69D58" stroke-width="1.1"/>
    <path d="M28 -8 C8 -14 -2 2 2 22 C20 16 32 4 28 -8 Z" fill="#FAF5EC" stroke="#C69D58" stroke-width="1.1"/>
    <circle cx="0" cy="-2" r="3.5" fill="#D4AC63"/>
  </g>
  <g transform="translate(685 1018)">
    <ellipse cx="-24" cy="14" rx="24" ry="8" transform="rotate(-22 -24 14)" fill="#758B70"/>
    <ellipse cx="28" cy="12" rx="24" ry="8" transform="rotate(20 28 12)" fill="#899E83"/>
    <path d="M0 -30 C16 -12 24 8 0 22 C-24 8 -16 -12 0 -30 Z" fill="#FFFFFF" stroke="#C69D58" stroke-width="1.2"/>
    <path d="M-28 -8 C-8 -14 2 2 -2 22 C-20 16 -32 4 -28 -8 Z" fill="#FAF5EC" stroke="#C69D58" stroke-width="1.1"/>
    <path d="M28 -8 C8 -14 -2 2 2 22 C20 16 32 4 28 -8 Z" fill="#FAF5EC" stroke="#C69D58" stroke-width="1.1"/>
    <circle cx="0" cy="-2" r="3.5" fill="#D4AC63"/>
  </g>
</svg>
