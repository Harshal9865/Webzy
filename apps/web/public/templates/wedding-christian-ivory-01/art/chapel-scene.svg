<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600" role="img" aria-label="Grace Cathedral heritage white Goan and coastal Indian chapel portrait">
  <defs>
    <linearGradient id="skyGrace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFEFC"/>
      <stop offset="36%" stop-color="#FAF6EE"/>
      <stop offset="58%" stop-color="#ECE6DA"/>
      <stop offset="80%" stop-color="#C4CBBF"/>
      <stop offset="100%" stop-color="#4A5C4E"/>
    </linearGradient>
    <radialGradient id="sunGrace" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F8EACC" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#E9E2D4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chapelStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#F4EEE3"/>
      <stop offset="100%" stop-color="#D5C9B6"/>
    </linearGradient>
    <linearGradient id="goldGrace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8E6BD"/>
      <stop offset="50%" stop-color="#C69C56"/>
      <stop offset="100%" stop-color="#876029"/>
    </linearGradient>
    <radialGradient id="stainedGlass" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9E6"/>
      <stop offset="48%" stop-color="#E2C78E"/>
      <stop offset="80%" stop-color="#96A89B"/>
      <stop offset="100%" stop-color="#586B5E"/>
    </radialGradient>
    <linearGradient id="aisleMarble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6F1E7"/>
      <stop offset="50%" stop-color="#EAE2D3"/>
      <stop offset="100%" stop-color="#D2C5B0"/>
    </linearGradient>
  </defs>

  <!-- Clear Luminous Ivory Sky (Top 42% completely airy for couple typography) -->
  <rect width="900" height="1600" fill="url(#skyGrace)"/>
  <circle cx="450" cy="700" r="340" fill="url(#sunGrace)"/>

  <!-- Subtle Cathedral Sunbeams Below Y=620 -->
  <g fill="#FFFDF6" opacity="0.28">
    <polygon points="450,620 180,1150 280,1150"/>
    <polygon points="450,620 620,1150 720,1150"/>
  </g>

  <!-- Soft Coastal Hills, Cypresses & Swaying Palms -->
  <path d="M0 960 Q220 885 450 932 T900 912 L900 1160 L0 1160 Z" fill="#A7B4A3" opacity="0.44"/>
  <path d="M0 1015 Q260 955 520 990 T900 975 L900 1200 L0 1200 Z" fill="#7D917B" opacity="0.46"/>
  <g fill="#536852" opacity="0.82">
    <ellipse cx="88" cy="952" rx="22" ry="104"/>
    <ellipse cx="136" cy="975" rx="17" ry="82"/>
    <ellipse cx="176" cy="992" rx="14" ry="64"/>
    <ellipse cx="812" cy="952" rx="22" ry="104"/>
    <ellipse cx="764" cy="975" rx="17" ry="82"/>
    <ellipse cx="724" cy="992" rx="14" ry="64"/>
  </g>

  <!-- White Heritage Indian-Portuguese Basilica & Twin Belfries -->
  <g transform="translate(450 0)">
    <!-- Central Baroque Gable Cross & Finial -->
    <line x1="0" y1="622" x2="0" y2="690" stroke="url(#goldGrace)" stroke-width="5.5" stroke-linecap="round"/>
    <line x1="-24" y1="648" x2="24" y2="648" stroke="url(#goldGrace)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="0" cy="648" r="5" fill="#FFFDF8" stroke="url(#goldGrace)" stroke-width="2"/>

    <!-- Twin Flanking Bell Towers with Cross Spires & Hanging Brass Bells -->
    <g>
      <!-- Left Belfry -->
      <line x1="-224" y1="654" x2="-224" y2="696" stroke="url(#goldGrace)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="-238" y1="670" x2="-210" y2="670" stroke="url(#goldGrace)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-272 758 Q-224 686 -176 758 Z" fill="#E7DDD0" stroke="url(#goldGrace)" stroke-width="1.6"/>
      <rect x="-266" y="758" width="84" height="442" fill="url(#chapelStone)" stroke="#C6B9A6" stroke-width="1.6"/>
      <!-- Upper Bell Arch & Hanging Bell -->
      <path d="M-244 852 L-244 798 Q-224 776 -204 798 L-204 852 Z" fill="#5D6E61" stroke="url(#goldGrace)" stroke-width="1.4"/>
      <path d="M-233 822 C-233 808 -224 804 -224 804 C-224 804 -215 808 -215 822 Z" fill="url(#goldGrace)"/>
      <circle cx="-224" cy="825" r="3" fill="#FFF6D6"/>
      <!-- Lower Lancet Window -->
      <path d="M-240 986 L-240 920 Q-224 900 -208 920 L-208 986 Z" fill="url(#stainedGlass)" stroke="url(#goldGrace)" stroke-width="1.4"/>
      <path d="M-240 1126 L-240 1054 Q-224 1034 -208 1054 L-208 1126 Z" fill="url(#stainedGlass)" stroke="url(#goldGrace)" stroke-width="1.4"/>

      <!-- Right Belfry -->
      <line x1="224" y1="654" x2="224" y2="696" stroke="url(#goldGrace)" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="210" y1="670" x2="238" y2="670" stroke="url(#goldGrace)" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M176 758 Q224 686 272 758 Z" fill="#E7DDD0" stroke="url(#goldGrace)" stroke-width="1.6"/>
      <rect x="182" y="758" width="84" height="442" fill="url(#chapelStone)" stroke="#C6B9A6" stroke-width="1.6"/>
      <path d="M204 852 L204 798 Q224 776 244 798 L244 852 Z" fill="#5D6E61" stroke="url(#goldGrace)" stroke-width="1.4"/>
      <path d="M215 822 C215 808 224 804 224 804 C224 804 233 808 233 822 Z" fill="url(#goldGrace)"/>
      <circle cx="224" cy="825" r="3" fill="#FFF6D6"/>
      <path d="M208 986 L208 920 Q224 900 240 920 L240 986 Z" fill="url(#stainedGlass)" stroke="url(#goldGrace)" stroke-width="1.4"/>
      <path d="M208 1126 L208 1054 Q224 1034 240 1054 L240 1126 Z" fill="url(#stainedGlass)" stroke="url(#goldGrace)" stroke-width="1.4"/>
    </g>

    <!-- Curved Baroque Scroll Gable & Pediment -->
    <path d="M-182 856 L-182 786 Q-118 776 -84 712 Q0 668 84 712 Q118 776 182 786 L182 856 Z" fill="url(#chapelStone)" stroke="#C6B9A6" stroke-width="1.8"/>
    <path d="M-158 844 Q-102 778 -70 726 Q0 688 70 726 Q102 778 158 844" fill="none" stroke="url(#goldGrace)" stroke-width="1.4"/>
    <!-- Pediment Medallion -->
    <circle cx="0" cy="768" r="24" fill="#FAF3E4" stroke="url(#goldGrace)" stroke-width="2"/>
    <path d="M0 752 L0 784 M-11 764 L11 764" stroke="url(#goldGrace)" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Main Nave Facade & Pilasters -->
    <rect x="-182" y="856" width="364" height="344" fill="url(#chapelStone)" stroke="#C6B9A6" stroke-width="1.8"/>
    <rect x="-188" y="850" width="376" height="10" fill="#E6DBC9" stroke="url(#goldGrace)" stroke-width="1.2"/>
    <!-- Corinthian Pilaster Pairs -->
    <rect x="-168" y="860" width="16" height="340" fill="#FAF6EE" stroke="#C8BCAA" stroke-width="1"/>
    <rect x="-106" y="860" width="14" height="340" fill="#FAF6EE" stroke="#C8BCAA" stroke-width="1"/>
    <rect x="92" y="860" width="14" height="340" fill="#FAF6EE" stroke="#C8BCAA" stroke-width="1"/>
    <rect x="152" y="860" width="16" height="340" fill="#FAF6EE" stroke="#C8BCAA" stroke-width="1"/>

    <!-- Stained-Glass Rose Window with 8-Spoke Tracery -->
    <circle cx="0" cy="918" r="46" fill="url(#stainedGlass)" stroke="url(#goldGrace)" stroke-width="3.2"/>
    <circle cx="0" cy="918" r="30" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="3 4"/>
    <g stroke="#FFFFFF" stroke-width="1.1" opacity="0.85">
      <line x1="0" y1="872" x2="0" y2="964"/>
      <line x1="-46" y1="918" x2="46" y2="918"/>
      <line x1="-32" y1="886" x2="32" y2="950"/>
      <line x1="32" y1="886" x2="-32" y2="950"/>
    </g>

    <!-- Flanking Side Stained-Glass Lancet Windows -->
    <path d="M-144 1094 L-144 996 Q-130 976 -116 996 L-116 1094 Z" fill="url(#stainedGlass)" stroke="url(#goldGrace)" stroke-width="1.5"/>
    <path d="M116 1094 L116 996 Q130 976 144 996 L144 1094 Z" fill="url(#stainedGlass)" stroke="url(#goldGrace)" stroke-width="1.5"/>

    <!-- Grand Gothic Portal Archway with Draped White Silk & Floral Arch -->
    <path d="M-82 1200 L-82 1038 Q-82 984 0 966 Q82 984 82 1038 L82 1200 Z" fill="#F4ECE0" stroke="url(#goldGrace)" stroke-width="2.2"/>
    <path d="M-66 1200 L-66 1044 Q-66 998 0 982 Q66 998 66 1044 L66 1200 Z" fill="#5D4738" stroke="url(#goldGrace)" stroke-width="2.5"/>
    <line x1="0" y1="982" x2="0" y2="1200" stroke="url(#goldGrace)" stroke-width="1.8"/>
    <!-- Warm Sanctuary Candlelight & Altar Glow Inside Open Portal -->
    <ellipse cx="0" cy="1118" rx="44" ry="62" fill="#FFF3C4" opacity="0.52"/>
    <path d="M0 1074 L0 1114 M-12 1088 L12 1088" stroke="#FFFDF5" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>

    <!-- White Rose & Olive Floral Garland Arch Crowning the Portal -->
    <path d="M-84 1054 Q-82 980 0 962 Q82 980 84 1054" fill="none" stroke="#687E63" stroke-width="12" stroke-linecap="round"/>
    <path d="M-84 1054 Q-82 980 0 962 Q82 980 84 1054" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-dasharray="2 16" stroke-linecap="round"/>

    <!-- Stepped Limestone Forecourt & Balustrade -->
    <rect x="-296" y="1200" width="592" height="18" fill="#F7F2E8" stroke="#C8BCAA" stroke-width="1.2"/>
    <rect x="-332" y="1218" width="664" height="20" fill="#ECE4D7" stroke="#C8BCAA" stroke-width="1.2"/>
    <rect x="-368" y="1238" width="736" height="22" fill="#DFD5C5" stroke="#C8BCAA" stroke-width="1.2"/>
  </g>

  <!-- Emerald Courtyard Lawn & Perspective Limestone Processional Aisle -->
  <rect x="0" y="1260" width="900" height="340" fill="#4B5E4E"/>
  <polygon points="355,1260 545,1260 710,1600 190,1600" fill="url(#aisleMarble)"/>
  <line x1="355" y1="1260" x2="190" y2="1600" stroke="url(#goldGrace)" stroke-width="2.5"/>
  <line x1="545" y1="1260" x2="710" y2="1600" stroke="url(#goldGrace)" stroke-width="2.5"/>
  <line x1="372" y1="1260" x2="220" y2="1600" stroke="#C49A55" stroke-width="1" stroke-dasharray="6 6" opacity="0.7"/>
  <line x1="528" y1="1260" x2="680" y2="1600" stroke="#C49A55" stroke-width="1" stroke-dasharray="6 6" opacity="0.7"/>

  <!-- Scattered White Rose & Lily Petals Along the Stone Aisle -->
  <g fill="#FFFFFF" opacity="0.88">
    <ellipse cx="385" cy="1310" rx="6" ry="3"/><ellipse cx="512" cy="1324" rx="7" ry="3.2"/>
    <ellipse cx="352" cy="1378" rx="8" ry="3.5"/><ellipse cx="542" cy="1386" rx="7.5" ry="3.5"/>
    <ellipse cx="318" cy="1455" rx="9" ry="4"/><ellipse cx="584" cy="1464" rx="9" ry="4"/>
    <ellipse cx="282" cy="1535" rx="10" ry="4.5"/><ellipse cx="618" cy="1542" rx="10" ry="4.5"/>
  </g>

  <!-- Flanking Pedestal Urns with Cascading White Madonna Lilies, Roses & Candle Lanterns -->
  <g>
    <!-- Upper Pair -->
    <g transform="translate(295 1350)">
      <rect x="-14" y="16" width="28" height="36" rx="3" fill="#F4EEE3" stroke="#C49A55" stroke-width="1.2"/>
      <ellipse cx="0" cy="4" rx="28" ry="12" fill="#6E8469"/>
      <circle cx="-12" cy="-2" r="14" fill="#FFFFFF"/><circle cx="12" cy="-2" r="14" fill="#FAF3E6"/>
      <circle cx="0" cy="-12" r="16" fill="#FFFFFF"/><circle cx="0" cy="-12" r="4" fill="#D9B166"/>
    </g>
    <g transform="translate(605 1350)">
      <rect x="-14" y="16" width="28" height="36" rx="3" fill="#F4EEE3" stroke="#C49A55" stroke-width="1.2"/>
      <ellipse cx="0" cy="4" rx="28" ry="12" fill="#6E8469"/>
      <circle cx="-12" cy="-2" r="14" fill="#FFFFFF"/><circle cx="12" cy="-2" r="14" fill="#FAF3E6"/>
      <circle cx="0" cy="-12" r="16" fill="#FFFFFF"/><circle cx="0" cy="-12" r="4" fill="#D9B166"/>
    </g>
    <!-- Foreground Pair with Glowing Brass Sanctuary Lanterns -->
    <g transform="translate(228 1485)">
      <rect x="-18" y="20" width="36" height="52" rx="4" fill="#F4EEE3" stroke="#C49A55" stroke-width="1.4"/>
      <ellipse cx="0" cy="6" rx="36" ry="15" fill="#6E8469"/>
      <circle cx="-16" cy="-2" r="18" fill="#FFFFFF"/><circle cx="16" cy="-2" r="18" fill="#FAF3E6"/>
      <circle cx="0" cy="-16" r="20" fill="#FFFFFF"/><circle cx="0" cy="-16" r="5" fill="#D9B166"/>
      <circle cx="38" cy="48" r="16" fill="#FFF3C4" opacity="0.45"/>
      <rect x="30" y="36" width="16" height="24" rx="2" fill="#FFF8DC" stroke="url(#goldGrace)" stroke-width="1.5"/>
    </g>
    <g transform="translate(672 1485)">
      <rect x="-18" y="20" width="36" height="52" rx="4" fill="#F4EEE3" stroke="#C49A55" stroke-width="1.4"/>
      <ellipse cx="0" cy="6" rx="36" ry="15" fill="#6E8469"/>
      <circle cx="-16" cy="-2" r="18" fill="#FFFFFF"/><circle cx="16" cy="-2" r="18" fill="#FAF3E6"/>
      <circle cx="0" cy="-16" r="20" fill="#FFFFFF"/><circle cx="0" cy="-16" r="5" fill="#D9B166"/>
      <circle cx="-38" cy="48" r="16" fill="#FFF3C4" opacity="0.45"/>
      <rect x="-46" y="36" width="16" height="24" rx="2" fill="#FFF8DC" stroke="url(#goldGrace)" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Champagne-Gold Sanctuary Frame & Top Corner Olive/Lily Boughs (Edges only) -->
  <rect x="26" y="26" width="848" height="1548" fill="none" stroke="url(#goldGrace)" stroke-width="2.2" opacity="0.78"/>
  <rect x="38" y="38" width="824" height="1524" fill="none" stroke="#C49A55" stroke-width="0.9" opacity="0.48"/>
  <g opacity="0.88">
    <path d="M28 112 Q64 56 142 30" fill="none" stroke="#6E8469" stroke-width="3"/>
    <ellipse cx="68" cy="68" rx="22" ry="8" transform="rotate(-28 68 68)" fill="#7E9478"/>
    <ellipse cx="108" cy="46" rx="20" ry="7" transform="rotate(-14 108 46)" fill="#8FA489"/>
    <circle cx="48" cy="88" r="14" fill="#FFFFFF" stroke="#C49A55" stroke-width="1"/>
    <circle cx="48" cy="88" r="4" fill="#D9B166"/>

    <path d="M872 112 Q836 56 758 30" fill="none" stroke="#6E8469" stroke-width="3"/>
    <ellipse cx="832" cy="68" rx="22" ry="8" transform="rotate(28 832 68)" fill="#7E9478"/>
    <ellipse cx="792" cy="46" rx="20" ry="7" transform="rotate(14 792 46)" fill="#8FA489"/>
    <circle cx="852" cy="88" r="14" fill="#FFFFFF" stroke="#C49A55" stroke-width="1"/>
    <circle cx="852" cy="88" r="4" fill="#D9B166"/>
  </g>
</svg>
