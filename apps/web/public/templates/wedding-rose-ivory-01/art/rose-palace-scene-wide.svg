<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Gulab Bagh pastel rose marble pavilion wide panoramic landscape">
  <defs>
    <linearGradient id="skyRoseW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDFC"/>
      <stop offset="34%" stop-color="#FCEFEE"/>
      <stop offset="56%" stop-color="#F5D9DE"/>
      <stop offset="80%" stop-color="#D7A6B2"/>
      <stop offset="100%" stop-color="#7D4958"/>
    </linearGradient>
    <radialGradient id="haloRoseW" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#FCE7EA" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F5D9DE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marbleW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDFB"/>
      <stop offset="58%" stop-color="#F5E4E6"/>
      <stop offset="100%" stop-color="#CFAEB6"/>
    </linearGradient>
    <linearGradient id="pondW" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C694A2"/>
      <stop offset="50%" stop-color="#855162"/>
      <stop offset="100%" stop-color="#4A2734"/>
    </linearGradient>
    <linearGradient id="goldW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7E1B3"/>
      <stop offset="52%" stop-color="#C69658"/>
      <stop offset="100%" stop-color="#8A5F30"/>
    </linearGradient>
  </defs>

  <!-- Clear Airy Blush Sky (Top 42% clear for couple typography) -->
  <rect width="1600" height="900" fill="url(#skyRoseW)"/>
  <ellipse cx="800" cy="430" rx="680" ry="280" fill="url(#haloRoseW)"/>

  <!-- Aravalli Horizon & Charbagh Cypress Groves -->
  <path d="M0 568 Q280 508 560 546 T1120 536 T1600 554 L1600 670 L0 670 Z" fill="#C99CA8" opacity="0.38"/>
  <path d="M0 596 Q400 548 800 576 T1600 566 L1600 675 L0 675 Z" fill="#A97483" opacity="0.34"/>
  <g fill="#687B65" opacity="0.72">
    <ellipse cx="144" cy="540" rx="20" ry="96"/>
    <ellipse cx="196" cy="556" rx="16" ry="78"/>
    <ellipse cx="242" cy="568" rx="14" ry="64"/>
    <ellipse cx="284" cy="578" rx="12" ry="52"/>
    <ellipse cx="1456" cy="540" rx="20" ry="96"/>
    <ellipse cx="1404" cy="556" rx="16" ry="78"/>
    <ellipse cx="1358" cy="568" rx="14" ry="64"/>
    <ellipse cx="1316" cy="578" rx="12" ry="52"/>
  </g>

