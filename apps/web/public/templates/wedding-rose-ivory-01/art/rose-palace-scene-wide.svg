  <g stroke="#FCE3E6" stroke-linecap="round" opacity="0.36">
    <line x1="680" y1="718" x2="920" y2="718" stroke-width="2.5"/>
    <line x1="718" y1="754" x2="882" y2="754" stroke-width="2"/>
    <line x1="748" y1="792" x2="852" y2="792" stroke-width="1.5"/>
    <line x1="772" y1="828" x2="828" y2="828" stroke-width="1.2"/>
