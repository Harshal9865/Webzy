    <circle cx="-376" cy="476" r="4" fill="url(#goldW)"/>
    <path d="M-430 536 Q-436 494 -376 482 Q-316 494 -322 536 Z" fill="url(#marbleW)" stroke="url(#goldW)" stroke-width="1.3"/>

