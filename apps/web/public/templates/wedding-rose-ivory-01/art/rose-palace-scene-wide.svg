    <circle cx="64" cy="72" r="24" fill="#DC909E" stroke="#C69658" stroke-width="1"/>
    <circle cx="64" cy="72" r="13" fill="#F6C8D0"/>
    <circle cx="64" cy="72" r="5" fill="#FFF5F7"/>
    <circle cx="112" cy="48" r="16" fill="#E6A5B1"/>
    <circle cx="48" cy="116" r="14" fill="#E6A5B1"/>

    <path d="M1574 126 Q1536 60 1444 26" fill="none" stroke="#687E64" stroke-width="3"/>
    <ellipse cx="1508" cy="54" rx="20" ry="7.5" transform="rotate(22 1508 54)" fill="#7E947A"/>
    <circle cx="1536" cy="72" r="24" fill="#DC909E" stroke="#C69658" stroke-width="1"/>
    <circle cx="1536" cy="72" r="13" fill="#F6C8D0"/>
    <circle cx="1536" cy="72" r="5" fill="#FFF5F7"/>
    <circle cx="1488" cy="48" r="16" fill="#E6A5B1"/>
    <circle cx="1552" cy="116" r="14" fill="#E6A5B1"/>
  </g>
