  <g transform="translate(800 0)">
    <!-- Left & Right Palace Colonnade Wings with Chhatri Domes -->
    <rect x="-520" y="544" width="286" height="126" fill="url(#marbleW)" stroke="#CCA6AE" stroke-width="1.4"/>
    <rect x="234" y="544" width="286" height="126" fill="url(#marbleW)" stroke="#CCA6AE" stroke-width="1.4"/>
    <rect x="-528" y="536" width="298" height="8" fill="#F4DADF" stroke="url(#goldW)" stroke-width="1.1"/>
    <rect x="230" y="536" width="298" height="8" fill="#F4DADF" stroke="url(#goldW)" stroke-width="1.1"/>

