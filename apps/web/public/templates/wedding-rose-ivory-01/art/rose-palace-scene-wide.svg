    <line x1="0" y1="538" x2="0" y2="572" stroke="#F7E1B3" stroke-width="1.4"/>
    <circle cx="0" cy="576" r="5" fill="#FFF9E6"/>
    <path d="M-66 566 Q-38 604 -56 670" fill="#F2C2CB" fill-opacity="0.45"/>
    <path d="M66 566 Q38 604 56 670" fill="#F2C2CB" fill-opacity="0.45"/>

