    <line x1="0" y1="366" x2="0" y2="416" stroke="url(#goldW)" stroke-width="3.8" stroke-linecap="round"/>
    <circle cx="0" cy="388" r="6" fill="url(#goldW)"/>
    <path d="M-86 504 Q-98 438 0 408 Q98 438 86 504 Z" fill="url(#marbleW)" stroke="url(#goldW)" stroke-width="1.6"/>
