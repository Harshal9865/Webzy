    <path d="M-194 670 L-194 576 Q-154 548 -114 576 L-114 670 Z" fill="#9A6070" stroke="url(#goldW)" stroke-width="1.5"/>
    <path d="M114 670 L114 576 Q154 548 194 576 L194 670 Z" fill="#9A6070" stroke="url(#goldW)" stroke-width="1.5"/>

