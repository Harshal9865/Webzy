    <rect x="-556" y="670" width="1112" height="10" fill="#F7E5E8" stroke="#C69658" stroke-width="0.9"/>
    <rect x="-588" y="680" width="1176" height="10" fill="#E9CBD1" stroke="#C69658" stroke-width="0.9"/>
