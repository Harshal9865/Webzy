    <path d="M310 780 Q324 798 310 808 Q296 798 310 780 Z" fill="#FFF3F5"/>
    <path d="M286 792 Q302 798 310 808 Q292 810 286 792 Z" fill="#F0AAB6"/>
    <path d="M334 792 Q318 798 310 808 Q328 810 334 792 Z" fill="#F0AAB6"/>

    <ellipse cx="1290" cy="818" rx="56" ry="15" fill="#5D745C" opacity="0.84"/>
    <path d="M1290 784 Q1306 802 1290 814 Q1274 802 1290 784 Z" fill="#FFF3F5"/>
    <path d="M1264 796 Q1282 802 1290 814 Q1270 816 1264 796 Z" fill="#F0AAB6"/>
    <path d="M1316 796 Q1298 802 1290 814 Q1310 816 1316 796 Z" fill="#F0AAB6"/>

    <circle cx="640" cy="834" r="12" fill="#FFE6B8" opacity="0.45"/>
    <path d="M640 824 Q644 830 640 836 Q636 830 640 824 Z" fill="#FFF9E2"/>
    <circle cx="960" cy="838" r="12" fill="#FFE6B8" opacity="0.45"/>
    <path d="M960 828 Q964 834 960 840 Q956 834 960 828 Z" fill="#FFF9E2"/>
  </g>

  <!-- Delicate Champagne Frame & Corner Damask Rose Trellises -->
  <rect x="24" y="24" width="1552" height="852" fill="none" stroke="url(#goldW)" stroke-width="2.2" opacity="0.76"/>
  <rect x="36" y="36" width="1528" height="828" fill="none" stroke="#C69658" stroke-width="0.9" opacity="0.48"/>
  <g opacity="0.92">
