    <path d="M-196 504 Q-200 470 -164 460 Q-128 470 -132 504 Z" fill="url(#marbleW)" stroke="url(#goldW)" stroke-width="1.2"/>
    <path d="M132 504 Q128 470 164 460 Q200 470 196 504 Z" fill="url(#marbleW)" stroke="url(#goldW)" stroke-width="1.2"/>

