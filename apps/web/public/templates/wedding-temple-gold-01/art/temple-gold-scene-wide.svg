    <radialGradient id="sunAura" cx="50%" cy="46%" r="46%">
      <stop offset="0%" stop-color="#FFFCEB" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#F7CF79" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#E5A84B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6D588"/>
      <stop offset="45%" stop-color="#C2802B"/>
      <stop offset="100%" stop-color="#5C240E"/>
    </linearGradient>
    <linearGradient id="waterTank" x1="0" y1="0" x2="0" y2="1">
