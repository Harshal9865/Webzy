    <rect x="-6" y="-134" width="12" height="134" fill="url(#goldLeaf)"/>
    <ellipse cx="0" cy="-70" rx="14" ry="5" fill="url(#goldLeaf)"/>
    <ellipse cx="0" cy="-134" rx="28" ry="8" fill="url(#goldLeaf)"/>
    <circle cx="0" cy="-148" r="18" fill="#F8C864" opacity="0.38"/>
