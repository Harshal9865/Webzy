  <path d="M1132 24 Q1332 124 1512 30" fill="none" stroke="#366232" stroke-width="10" stroke-linecap="round"/>
  <path d="M1132 28 Q1332 128 1512 34" fill="none" stroke="#FFFDF5" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>

